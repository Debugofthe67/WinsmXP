\<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Start</title>
  <link rel="icon" href="data:," />
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #180052;
      background-image: radial-gradient(circle at 20% 25%, #2b0a7a 0%, #180052 55%, #0f0036 100%);
      color: #fff;
      font-family: "Segoe UI", "Segoe WP", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 64px;
      overflow: hidden;
    }
    .start-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      max-width: 980px;
      width: 100%;
      margin: 0 auto 32px auto;
    }
    .start-title {
      font-size: 48px;
      font-weight: 200;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 300;
    }
    .user-avatar {
      width: 42px;
      height: 42px;
      background: #008299;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 400;
    }
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
    }
    .tile {
      height: 185px;
      position: relative;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      display: block;
      overflow: hidden;
      transition: transform 0.14s ease, outline 0.1s;
    }
    .tile:hover {
      outline: 3px solid rgba(255, 255, 255, 0.55);
    }
    .tile:active {
      transform: scale(0.97);
    }
    .tile-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    /* Classic Windows 8 Metro Tile & Splash Colors */
    .tile-xp .tile-face, .splash-xp { background: #00a300; }
    .tile-7 .tile-face, .splash-7 { background: #2d89ef; }
    .tile-8 .tile-face, .splash-8 { background: #008299; }

    /* Full-Bleed OS Preview Screenshot */
    .tile-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
      pointer-events: none;
    }
    .tile:hover .tile-preview {
      transform: scale(1.05);
    }
    .tile-caption {
      position: relative;
      z-index: 1;
      padding: 28px 16px 14px 16px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.45) 65%, transparent 100%);
    }
    .tile-label {
      font-size: 17px;
      font-weight: 400;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }
    .tile-sub {
      font-size: 12px;
      opacity: 0.88;
      margin-top: 2px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Full-Screen Windows 8 Flip & Expand Splash */
    #splash_stage {
      position: fixed;
      inset: 0;
      perspective: 1400px;
      pointer-events: none;
      z-index: 9999;
      display: none;
    }
    #splash_card {
      position: fixed;
      transform-style: preserve-3d;
      transition:
        top 0.68s cubic-bezier(0.22, 1, 0.36, 1),
        left 0.68s cubic-bezier(0.22, 1, 0.36, 1),
        width 0.68s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.68s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.68s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #splash_card.expanded {
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      transform: rotateY(180deg);
    }
    .splash-side {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .splash-front {
      justify-content: flex-end;
    }
    .splash-back {
      transform: rotateY(180deg);
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
      padding: 24px;
    }
    .splash-preview-frame {
      width: min(380px, 80vw);
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .splash-text {
      font-size: 22px;
      font-weight: 300;
      opacity: 0.95;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media (max-width: 640px) {
      body { padding: 28px 24px; }
      .start-title { font-size: 36px; }
    }
  </style>
</head>
<body>
  <div class="start-header">
    <h1 class="start-title">Start</h1>
    <div class="user-badge">
      <span>User</span>
      <div class="user-avatar">U</div>
    </div>
  </div>

  <div class="tile-grid">
    <a class="tile tile-xp" href="xp/index.html" data-target="xp/index.html" data-theme="splash-xp" data-img="previews/xp.jpg" data-title="Windows XP">
      <div class="tile-face">
        <img class="tile-preview" src="previews/xp.jpg" alt="Windows XP Preview" />
        <div class="tile-caption">
          <div class="tile-label">Windows XP</div>
          <div class="tile-sub">512 MB • Standard PC</div>
        </div>
      </div>
    </a>

    <a class="tile tile-7" href="7/index.html" data-target="7/index.html" data-theme="splash-7" data-img="previews/7.png" data-title="Windows 7">
      <div class="tile-face">
        <img class="tile-preview" src="previews/7.png" alt="Windows 7 Preview" />
        <div class="tile-caption">
          <div class="tile-label">Windows 7</div>
          <div class="tile-sub">512 MB • ACPI</div>
        </div>
      </div>
    </a>

    <a class="tile tile-8" href="8/index.html" data-target="8/index.html" data-theme="splash-8" data-img="previews/8.png" data-title="Windows 8">
      <div class="tile-face">
        <img class="tile-preview" src="previews/8.png" alt="Windows 8 Preview" />
        <div class="tile-caption">
          <div class="tile-label">Windows 8.1</div>
          <div class="tile-sub">1024 MB • ACPI</div>
        </div>
      </div>
    </a>
  </div>

  <!-- Full-Screen Flip Splash Container -->
  <div id="splash_stage">
    <div id="splash_card">
      <div class="splash-side splash-front" id="splash_front"></div>
      <div class="splash-side splash-back" id="splash_back">
        <img class="splash-preview-frame" id="splash_logo" src="" alt="" />
        <div class="spinner"></div>
        <div class="splash-text" id="splash_text"></div>
      </div>
    </div>
  </div>

  <script>
    let isLaunching = false;
    const stage = document.getElementById("splash_stage");
    const card = document.getElementById("splash_card");
    const front = document.getElementById("splash_front");
    const back = document.getElementById("splash_back");

    window.addEventListener("pageshow", () => {
      isLaunching = false;
      stage.style.display = "none";
      card.classList.remove("expanded");
    });

    document.querySelectorAll(".tile").forEach(tile => {
      tile.addEventListener("click", function (e) {
        e.preventDefault();
        if (isLaunching) return;
        isLaunching = true;

        const rect = this.getBoundingClientRect();
        const targetUrl = this.dataset.target;
        const theme = this.dataset.theme;

        front.className = "splash-side splash-front " + theme;
        back.className = "splash-side splash-back " + theme;
        front.innerHTML = this.querySelector(".tile-face").innerHTML;
        document.getElementById("splash_logo").src = this.dataset.img;
        document.getElementById("splash_text").textContent = "Launching " + this.dataset.title + "...";

        card.style.top = rect.top + "px";
        card.style.left = rect.left + "px";
        card.style.width = rect.width + "px";
        card.style.height = rect.height + "px";
        card.classList.remove("expanded");
        stage.style.display = "block";

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            card.classList.add("expanded");
          });
        });

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 720);
      });
    });
  </script>
</body>
</html>
