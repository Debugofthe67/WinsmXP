<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Windows XP in v86</title>
  <link rel="icon" href="data:," />
<script src="coi-serviceworker.js"></script>
<script src="libv86.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { background: #111; color: #eee; font-family: monospace; margin: 0; padding: 12px; display: flex; gap: 12px; height: 100vh; }
    #left_pane { flex: 1; display: flex; align-items: center; justify-content: center; background: #080808; border: 1px solid #333; padding: 8px; overflow: auto; }
    #screen_container { border: 2px solid #0f0; background: #000; cursor: pointer; }
    #screen_container:fullscreen { display: flex; align-items: center; justify-content: center; border: none; }
    #right_pane { width: 400px; display: flex; flex-direction: column; gap: 8px; background: #181818; border: 1px solid #333; padding: 10px; overflow-y: auto; }
    .panel-box { background: #202020; border: 1px solid #333; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    input[type="text"], input[type="file"], button { background: #111; color: #eee; border: 1px solid #555; padding: 6px; font-family: monospace; width: 100%; font-size: 12px; }
    button { background: #1e4620; border-color: #2e7d32; cursor: pointer; font-weight: bold; }
    button:hover:not(:disabled) { background: #275c2a; }
    button.secondary { background: #1a334d; border-color: #2b547e; }
    button.secondary:hover:not(:disabled) { background: #234566; }
    button.warn { background: #4d261a; border-color: #7e3b2b; }
    button:disabled { background: #222; border-color: #444; color: #777; cursor: not-allowed; }
    label.inline-check { display: flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; }
    #stats_bar { background: #111; border: 1px solid #333; padding: 6px 8px; font-size: 11px; color: #7cf; display: flex; justify-content: space-between; }
    #log { flex: 1; min-height: 160px; background: #0d0d0d; border: 1px solid #333; padding: 8px; white-space: pre-wrap; word-break: break-word; color: #7f7; overflow-y: auto; font-size: 11px; }
  </style>
</head>
<body>
  <div id="left_pane">
    <div id="screen_container" tabindex="0" title="Click inside screen to capture mouse & keyboard (Esc to release)">
      <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
      <canvas style="display: none"></canvas>
    </div>
  </div>
  <div id="right_pane">
    <div class="panel-box">
      <strong>1. Load Local Disk (.img)</strong>
      <input type="file" id="disk_picker" accept=".img" />


    </div>
    <div class="panel-box">
      <strong>2. Or Boot From URL (.img)</strong>
  <input type="text" id="disk_url" value="https://huggingface.co/datasets/Debugofthe67/wasmed7/resolve/main/winxp.img" />
      <button id="load_url_btn">Download & Boot URL</button>
    </div>
    <div class="panel-box">
      <strong>3. VM Controls & Shortcuts</strong>
      <div class="btn-grid">
        <button id="cad_btn" class="secondary" disabled>Send Ctrl+Alt+Del</button>
        <button id="fullscreen_btn" class="secondary" disabled>Fullscreen</button>
        <button id="pause_btn" class="secondary" disabled>Pause VM</button>
        <button id="screenshot_btn" class="secondary" disabled>Take Screenshot</button>
        <button id="reset_btn" class="warn" disabled>Reboot VM</button>
        <button id="download_img_btn" disabled>Export .img</button>
      </div>
    </div>
    <div class="panel-box">
      <strong>4. Instant Save / Restore State (.bin)</strong>
      <div class="btn-grid">
        <button id="save_state_btn" class="secondary" disabled>Save State File</button>
        <button id="load_state_btn" class="secondary" disabled>Load State File</button>
      </div>
      <input type="file" id="state_picker" accept=".bin" style="display: none;" />
    </div>
    <div id="stats_bar">
      <span id="stat_cpu">CPU: Idle</span>
      <span id="stat_disk">Reads: 0 | Writes: 0</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <strong>Live Boot & System Console</strong>
      <button id="clear_log_btn" style="width: auto; padding: 2px 8px; font-size: 11px;" class="secondary">Clear</button>
    </div>
    <div id="log">Ready. Pick winxp.img or enter a URL above.</div>
  </div>
  <script>
    const logBox = document.getElementById("log");
    const statCpu = document.getElementById("stat_cpu");
    const statDisk = document.getElementById("stat_disk");
    const textDiv = document.querySelector("#screen_container div");
    const canvas = document.querySelector("#screen_container canvas");

    function log(msg) {
      logBox.textContent += "\n[" + new Date().toLocaleTimeString() + "] " + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }

    document.getElementById("clear_log_btn").onclick = () => { logBox.textContent = "Console cleared."; };
    window.addEventListener("error", e => log("JS Error: " + e.message));
    window.addEventListener("unhandledrejection", e => log("Promise Error: " + e.reason));

    function setVmButtonsEnabled(enabled) {
      ["cad_btn", "fullscreen_btn", "pause_btn", "screenshot_btn", "reset_btn", "download_img_btn", "save_state_btn", "load_state_btn"]
        .forEach(id => document.getElementById(id).disabled = !enabled);
    }

    function updateDisplayMode(isGraphical) {
      textDiv.style.display = isGraphical ? "none" : "block";
      canvas.style.display = isGraphical ? "block" : "none";
    }

    function startEmulator(hdaConfig) {
      if (window.emulator) {
        try { window.emulator.destroy(); } catch (e) {}
      }
      const EmulatorClass = window.V86 || window.V86Starter;
      const useAcpi = false;
      log("Starting v86 with SeaBIOS (ACPI: " + useAcpi + ")...");

      window.emulator = new EmulatorClass({
        wasm_path: "v86.wasm",
        memory_size: 512 * 1024 * 1024,
        vga_memory_size: 16 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: { url: "bios/seabios.bin" },
        vga_bios: { url: "bios/vgabios.bin" },
        hda: hdaConfig,
        acpi: useAcpi,
        boot_order: 0x132,
        disable_mouse: false,
        disable_keyboard: false,
        autostart: true,
      });


      let diskReads = 0, diskWrites = 0, lastInstrCount = 0, lastScreenText = "";

      window.emulator.add_listener("download-error", err => log("Download Error: " + JSON.stringify(err)));
      window.emulator.add_listener("emulator-ready", () => log("Event: emulator-ready"));
      window.emulator.add_listener("emulator-started", () => {
        log("Event: emulator-started (Click screen to lock mouse/keyboard)");
        setVmButtonsEnabled(true);
      });
      window.emulator.add_listener("screen-set-mode", isGraphical => {
        log("VGA Mode -> " + (isGraphical ? "Graphical (Framebuffer)" : "Text Mode"));
        updateDisplayMode(isGraphical);
      });
      window.emulator.add_listener("screen-set-size", s => {
        log("Screen Resized -> " + s.join("x"));
        updateDisplayMode(s[2] > 0);
      });
      window.emulator.add_listener("ide-read-start", () => {
        diskReads++;
        statDisk.textContent = "Reads: " + diskReads + " | Writes: " + diskWrites;
        if (diskReads === 1 || diskReads % 100 === 0) log("IDE Disk Read #" + diskReads + " (OS loading sectors...)");
      });
      window.emulator.add_listener("ide-write-end", () => {
        diskWrites++;
        statDisk.textContent = "Reads: " + diskReads + " | Writes: " + diskWrites;
      });
      window.emulator.add_listener("serial0-output-byte", b => {
        const ch = String.fromCharCode(b);
        if (ch === "\n") logBox.textContent += "\n[COM1] ";
        else if (b >= 32 && b <= 126) logBox.textContent += ch;
        logBox.scrollTop = logBox.scrollHeight;
      });

      setInterval(() => {
        if (!window.emulator) return;
        const count = window.emulator.get_instruction_counter();
        statCpu.textContent = "CPU: " + ((count - lastInstrCount) / 1000000).toFixed(1) + " MIPS";
        lastInstrCount = count;

        if (textDiv && textDiv.style.display !== "none") {
          const currentText = textDiv.innerText.trim();
          if (currentText && currentText !== lastScreenText) {
            lastScreenText = currentText;
            log("BIOS/Text Screen:\n" + currentText);
          }
        }
      }, 1000);

      document.getElementById("screen_container").onclick = function () {
        this.focus();
        window.emulator.lock_mouse();
        if (window.emulator.keyboard_set_status) {
          window.emulator.keyboard_set_status(true);
        }
      };
    }

    document.getElementById("disk_picker").onchange = function (e) {
      const file = e.target.files.item(0);
      if (!file) return;
      log("Selected local file: " + file.name + " (" + file.size + " bytes)");
      startEmulator({ buffer: file });
    };

    document.getElementById("load_url_btn").onclick = async function () {
      const url = document.getElementById("disk_url").value.trim();
      if (!url) return log("Enter a valid .img URL first.");
      try {
        log("Downloading to temporary file: " + url + "...");
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);

        const total = Number(res.headers.get("Content-Length")) || 0;
        const reader = res.body.getReader();
        const chunks = [];
        let received = 0, lastLoggedPct = -5;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          if (total > 0) {
            const pct = Math.floor((received / total) * 100);
            if (pct >= lastLoggedPct + 5) {
              lastLoggedPct = pct;
              log("Downloading: " + pct + "% (" + (received / 1048576).toFixed(1) + " MB)");
            }
          }
        }

        const tempFile = new File(chunks, "winxp.img");
        log("Download complete (" + tempFile.size + " bytes). Booting...");
        startEmulator({ buffer: tempFile });
      } catch (err) {
        log("URL Download Failed: " + err.message);
      }
    };


    document.getElementById("cad_btn").onclick = () => {
      if (!window.emulator) return;
      window.emulator.keyboard_send_scancodes([0x1D, 0x38, 0xE0, 0x53, 0xE0, 0xD3, 0xB8, 0x9D]);
      log("Sent Ctrl+Alt+Del to VM.");
    };
    document.getElementById("fullscreen_btn").onclick = () => document.getElementById("screen_container").requestFullscreen?.();
    let isPaused = false;
    document.getElementById("pause_btn").onclick = function () {
      if (!window.emulator) return;
      isPaused ? window.emulator.run() : window.emulator.stop();
      isPaused = !isPaused;
      this.textContent = isPaused ? "Resume VM" : "Pause VM";
      log(isPaused ? "VM Paused." : "VM Resumed.");
    };
    document.getElementById("screenshot_btn").onclick = () => {
      if (!window.emulator) return;
      const a = document.createElement("a");
      a.href = window.emulator.screen_make_screenshot().src;
      a.download = "winxp-screenshot.png";
      a.click();
      log("Screenshot saved.");
    };
    document.getElementById("reset_btn").onclick = () => { if (window.emulator) { window.emulator.restart(); log("VM Rebooted."); } };
    document.getElementById("download_img_btn").onclick = async () => {
      if (!window.emulator) return;
      log("Exporting disk image...");
      const buf = await window.emulator.disk_images.hda.get_as_file();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([buf]));
      a.download = "winxp-saved.img";
      a.click();
      log("Download started: winxp-saved.img");
    };
    document.getElementById("save_state_btn").onclick = async () => {
      if (!window.emulator) return;
      log("Saving state snapshot...");
      const state = await window.emulator.save_state();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([state]));
      a.download = "winxp-state.bin";
      a.click();
      log("State snapshot saved: winxp-state.bin");
    };
    document.getElementById("load_state_btn").onclick = () => document.getElementById("state_picker").click();
    document.getElementById("state_picker").onchange = async e => {
      const file = e.target.files.item(0);
      if (!file || !window.emulator) return;
      log("Restoring state snapshot: " + file.name + "...");
      await window.emulator.restore_state(await file.arrayBuffer());
      log("State restored!");
    };
  </script>
</body>
</html>
